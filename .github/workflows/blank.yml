name: RDP assistente

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 99999999999

    steps:
      - name: Instalar e Configurar Tailscale
        shell: pwsh
        run: |
          # Instala o Tailscale de forma silenciosa na VM do GitHub
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          
          # Inicia o Tailscale e define o nome fixo da máquina na sua rede
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="rdp-blzinn" --accept-routes
          
          # Confirma e exibe o IP atribuído no registo
          $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4)
          Write-Host "Tailscale ligado com sucesso! IP atual: $ip"

      - name: Ativar Área de Trabalho Remota (RDP)
        shell: pwsh
        run: |
          # Permite ligações RDP e ajusta o Firewall do Windows
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "Servidor RDP ativado!"

      - name: Manter o Servidor Ligado
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Servidor online e pronto a conectar!"
          Write-Host "Nome para conectar no RDP: rdp-blzinn"
          Write-Host "=========================================="
          while ($true) { Start-Sleep -Seconds 60 }
          
