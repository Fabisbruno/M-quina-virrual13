name: RDP persistente

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    # Runner self-hosted instalado na máquina Windows persistente.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Verificar pré-requisitos do RDP e Tailscale
        shell: pwsh
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale não está instalado neste host."
          }

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) {
            throw "Este host não está conectado ao Tailscale. Conecte-o uma vez e mantenha a identidade do dispositivo."
          }

          $rdp = Get-Service -Name TermService -ErrorAction Stop
          if ($rdp.Status -ne "Running") {
            Start-Service -Name TermService
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Host conectado ao Tailscale: $ip"

      - name: Exibir instruções de conexão
        shell: pwsh
        run: |
          Write-Host "Endereço RDP (IP Tailscale): $env:TAILSCALE_IP"
          Write-Host "Usuário: Blzinn"
          Write-Host "Conecte pelo cliente de Área de Trabalho Remota."
          Write-Host "A conta Blzinn deve existir no Windows e ter permissão para RDP."
          
