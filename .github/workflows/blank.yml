name: RDP assistente

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Criar Utilizador Bruno com Net User
        shell: pwsh
        run: |
          # Cria o utilizador Bruno e adiciona aos grupos de Administrador e RDP
          net user Bruno 123579 /add
          net localgroup administrators Bruno /add
          net localgroup "Remote Desktop Users" Bruno /add
          Write-Host "Utilizador Bruno criado e configurado com sucesso!"

      - name: Instalar e Configurar Tailscale
        shell: pwsh
        run: |
          Write-Host "A instalar o Tailscale..."
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          
          Start-Sleep -Seconds 5
          
          Write-Host "A conectar à rede Tailscale..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="rdp-blzinn" --accept-routes
          
          # Aguardar até o IP ser atribuído com sucesso
          $ip = $null
          for ($i=0; $i -lt 15; $i++) {
              $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1)
              if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') { break }
              Write-Host "A aguardar pela atribuição do IP..."
              Start-Sleep -Seconds 3
          }
          
          Write-Host "=========================================="
          Write-Host " Tailscale conectado com sucesso!         "
          Write-Host " IP obtido: $ip                           "
          Write-Host "=========================================="

      - name: Ativar Área de Trabalho Remota (RDP)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP ativado com sucesso!"

      - name: Manter o Servidor Ligado e Mostrar Credenciais
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Servidor online e pronto a conectar!    "
          Write-Host " Endereço (Hostname): rdp-blzinn          "
          Write-Host " Nome de Utilizador: Bruno                "
          Write-Host " Palavra-passe: 123579                    "
          Write-Host "=========================================="
          while ($true) { Start-Sleep -Seconds 60 }
          
